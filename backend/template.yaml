AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Plantilla SAM para el MVP de sistema de stock y ventas multi‑tenant. Despliega una tabla DynamoDB
  de single‑table, funciones Lambda para manejar productos, ventas y reportes, un API HTTP y
  un User Pool de Cognito con grupos de rol.

Parameters:
  CommerceStage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: Nombre del entorno (dev o prod).
  RetentionDays:
    Type: Number
    Default: 90
    Description: Número de dias que se retendrán las ventas antes de expirar (TTL).
  FrontendBaseUrl:
    Type: String
    Default: http://localhost:3000
    Description: URL base del frontend para construir enlaces públicos.
  BillingMonthlyAmount:
    Type: Number
    Default: 0
    Description: Precio mensual de la suscripción en moneda local.
  BillingCurrencyId:
    Type: String
    Default: ARS
    Description: Moneda de la suscripción de Mercado Pago.
  BillingTrialDays:
    Type: Number
    Default: 30
    Description: Duración del trial inicial.
  BillingGraceDays:
    Type: Number
    Default: 3
    Description: Días de gracia ante pago fallido.
  BillingPlanReason:
    Type: String
    Default: G&S Comercios
    Description: Texto descriptivo del plan en Mercado Pago.
  BillingPublicRegistrationPath:
    Type: String
    Default: /suscripcion
    Description: Ruta pública de retorno tras la autorización.
  MercadoPagoAccessToken:
    Type: String
    NoEcho: true
    Description: Access token privado de Mercado Pago.
  MercadoPagoWebhookSecret:
    Type: String
    NoEcho: true
    Description: Secret para validar firmas de webhooks.
  MercadoPagoPreapprovalPlanId:
    Type: String
    Default: ''
    Description: ID del plan recurrente creado en Mercado Pago.
  MercadoPagoReactivationPlanId:
    Type: String
    Default: ''
    Description: ID del plan mensual sin trial para reactivaciones.
  CancellationEmailFrom:
    Type: String
    Default: clientes@gestionystock.com
    Description: Identidad remitente verificada en Amazon SES.
  CancellationEmailTo:
    Type: String
    Default: clientes@gestionystock.com
    Description: Destino de los motivos de cancelación.
  SupportEmailFrom:
    Type: String
    Default: clientes@gestionystock.com
    Description: Identidad remitente verificada en Amazon SES para solicitudes de soporte.
  SupportEmailTo:
    Type: String
    Default: clientes@gestionystock.com
    Description: Destino fijo de las solicitudes de soporte.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - x86_64
    Timeout: 10
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref GestionComercios
        COMMERCE_STAGE: !Ref CommerceStage
        RETENTION_DAYS: !Ref RetentionDays
        SALES_BY_DAY_GSI: GSI-Ventas-Por-Dia
        FRONTEND_BASE_URL: !Ref FrontendBaseUrl
        BILLING_MONTHLY_AMOUNT: !Ref BillingMonthlyAmount
        BILLING_CURRENCY_ID: !Ref BillingCurrencyId
        BILLING_TRIAL_DAYS: !Ref BillingTrialDays
        BILLING_GRACE_DAYS: !Ref BillingGraceDays
        BILLING_PLAN_REASON: !Ref BillingPlanReason
        BILLING_PUBLIC_REGISTRATION_PATH: !Ref BillingPublicRegistrationPath
        MERCADO_PAGO_ACCESS_TOKEN: !Ref MercadoPagoAccessToken
        MERCADO_PAGO_WEBHOOK_SECRET: !Ref MercadoPagoWebhookSecret
        MERCADO_PAGO_PREAPPROVAL_PLAN_ID: !Ref MercadoPagoPreapprovalPlanId
        MERCADO_PAGO_REACTIVATION_PLAN_ID: !Ref MercadoPagoReactivationPlanId
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        CANCELLATION_FEEDBACK_QUEUE_URL: !Ref CancellationFeedbackQueue
        CANCELLATION_EMAIL_FROM: !Ref CancellationEmailFrom
        CANCELLATION_EMAIL_TO: !Ref CancellationEmailTo
        SUPPORT_EMAIL_FROM: !Ref SupportEmailFrom
        SUPPORT_EMAIL_TO: !Ref SupportEmailTo

Resources:
  ## DynamoDB single-table para productos y ventas
  GestionComercios:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub GestionComercios-${CommerceStage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: alertStatus
          AttributeType: S
        - AttributeName: statPK
          AttributeType: S
        - AttributeName: monthlyUnits
          AttributeType: N
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      GlobalSecondaryIndexes:
        - IndexName: GSI-Ventas-Por-Dia
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-Productos-Activos
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI-Stock-Critico
          KeySchema:
            - AttributeName: PK
              KeyType: HASH
            - AttributeName: alertStatus
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - code
              - name
              - stock
              - minStock
        - IndexName: GSI-Ranking-Mensual
          KeySchema:
            - AttributeName: statPK
              KeyType: HASH
            - AttributeName: monthlyUnits
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - name
              - code
              - uom
              - priceSale

  ## Cognito User Pool y grupos de roles
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub commerce-mvp-${CommerceStage}
      AutoVerifiedAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: custom:commerceIds
          AttributeDataType: String
          Mutable: true
        - Name: custom:accountStatus
          AttributeDataType: String
          Mutable: true
        - Name: custom:regId
          AttributeDataType: String
          Mutable: true
        - Name: commerceIds
          AttributeDataType: String
          Mutable: true
        # Correct names. Entries prefixed with custom: above are retained because
        # Cognito custom attributes are immutable once created.
        - Name: accountStatus
          AttributeDataType: String
          Mutable: true
        - Name: regId
          AttributeDataType: String
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool
      Description: Administradores con acceso total a productos y ventas.

  UserPoolVendedorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: vendedor
      UserPoolId: !Ref UserPool
      Description: Vendedores con permisos limitados.

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: false
      ExplicitAuthFlows:
        - ADMIN_NO_SRP_AUTH
        - USER_PASSWORD_AUTH
      SupportedIdentityProviders:
        - COGNITO

  ## API HTTP con authorizer
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref CommerceStage
      CorsConfiguration:
        AllowOrigins:
          - https://comercios.gestionystock.com
          - http://localhost:3000
          - http://localhost:3001
          - https://v0-gestion-comercios.vercel.app
        AllowHeaders:
          - Content-Type
          - Authorization
          - Idempotency-Key
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowCredentials: true
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              Audience:
                - !Ref UserPoolClient
              Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
        DefaultAuthorizer: CognitoJwtAuthorizer

  ## Rol para Lambdas con acceso a DynamoDB
  LambdaDynamoRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub commerce-mvp-lambda-role-${CommerceStage}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CommerceMvpDynamoPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                  - dynamodb:ConditionCheckItem
                  - dynamodb:DescribeTable
                Resource: !GetAtt GestionComercios.Arn
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/GestionComercios-${CommerceStage}/index/GSI-Ventas-Por-Dia
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/GestionComercios-${CommerceStage}/index/GSI-Productos-Activos
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/GestionComercios-${CommerceStage}/index/GSI-Stock-Critico
              - Effect: Allow
                Action:
                  - dynamodb:Query
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/GestionComercios-${CommerceStage}/index/GSI-Ranking-Mensual
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt GestionComercios.StreamArn
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminResetUserPassword
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:ListUsers
                  - cognito-idp:ConfirmSignUp
                  - cognito-idp:ResendConfirmationCode
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPool}
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt CancellationFeedbackQueue.Arn
                  - !GetAtt CancellationFeedbackDeadLetterQueue.Arn
              - Effect: Allow
                Action:
                  - ses:SendEmail
                Resource: '*'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  CancellationFeedbackDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cancellation-feedback-dlq-${CommerceStage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  CancellationFeedbackQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cancellation-feedback-${CommerceStage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      SqsManagedSseEnabled: true
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt CancellationFeedbackDeadLetterQueue.Arn
        maxReceiveCount: 5

  CancellationFeedbackDlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: !Sub Fallos de entrega de motivos de cancelación (${CommerceStage})
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt CancellationFeedbackDeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  SendCancellationFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub sendCancellationFeedback-${CommerceStage}
      CodeUri: ./dist
      Handler: handlers/sendCancellationFeedback.handler
      Role: !GetAtt LambdaDynamoRole.Arn
      Timeout: 30
      Events:
        FeedbackQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt CancellationFeedbackQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  PublishCancellationFeedbackFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub publishCancellationFeedback-${CommerceStage}
      CodeUri: ./dist
      Handler: handlers/publishCancellationFeedback.handler
      Role: !GetAtt LambdaDynamoRole.Arn
      Timeout: 30
      Events:
        CancellationOutbox:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt GestionComercios.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true
            FilterCriteria:
              Filters:
                - Pattern: '{ "eventName": ["INSERT", "MODIFY"], "dynamodb": { "NewImage": { "type": { "S": ["BILLING_CANCELLATION"] }, "status": { "S": ["completed"] }, "notificationStatus": { "S": ["pending"] } } } }'

  ## Lambdas y rutas
  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub createProduct-${CommerceStage}
      CodeUri: ./dist
      Handler: handlers/createProduct.handler
      Role: !GetAtt LambdaDynamoRole.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/{commerceId}/products'
            Method: POST

  UpdateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub updateProduct-${CommerceStage}
      CodeUri: ./dist
      Handler: handlers/updateProduct.handler
      Role: !GetAtt LambdaDynamoRole.Arn
      Events:
