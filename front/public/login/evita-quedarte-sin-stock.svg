<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Alerta de stock bajo</title>
  <desc id="desc">Panel de inventario con productos, cantidades disponibles y una alerta para reponer un artículo con pocas unidades.</desc>
  <defs>
    <filter id="shadow" x="43" y="23" width="634" height="412" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset in="blur" dy="18" result="offsetBlur"/>
      <feFlood flood-color="#004b30" flood-opacity=".22" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowShape"/>
      <feMerge><feMergeNode in="shadowShape"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="notice-shadow" x="386" y="143" width="251" height="174" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset in="blur" dy="10" result="offsetBlur"/>
      <feFlood flood-color="#004b30" flood-opacity=".14" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowShape"/>
      <feMerge><feMergeNode in="shadowShape"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="panel" x1="150" y1="75" x2="575" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#eafff5"/>
    </linearGradient>
    <linearGradient id="alert" x1="411" y1="168" x2="596" y2="283" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#f2faf6"/>
    </linearGradient>
  </defs>

  <circle cx="104" cy="96" r="56" fill="#fff" fill-opacity=".08"/>
  <path d="M590 348c30-12 49-38 51-69" stroke="#003f29" stroke-opacity=".1" stroke-width="28" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="95" y="56" width="530" height="328" rx="25" fill="url(#panel)"/>

    <text x="132" y="105" fill="#18352a" font-family="Arial,sans-serif" font-size="17" font-weight="700">Inventario de productos</text>
    <circle cx="580" cy="94" r="19" fill="#dff5e9"/>
    <path d="M574 97h12M576 97v-7a4 4 0 0 1 8 0v7l3 4h-14l3-4Z" stroke="#009A61" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="580" cy="104" r="1.8" fill="#009A61"/>

    <rect x="132" y="131" width="456" height="62" rx="14" fill="#f2faf6"/>
    <rect x="151" y="146" width="32" height="32" rx="9" fill="#c9f2dc"/>
    <path d="M159 154h16v16h-16zM159 159h16" stroke="#009A61" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="200" y="148" width="126" height="9" rx="4.5" fill="#18352a"/>
    <rect x="200" y="168" width="91" height="7" rx="3.5" fill="#b7d1c5"/>
    <rect x="501" y="148" width="68" height="28" rx="9" fill="#c9f2dc"/>
    <text x="535" y="167" text-anchor="middle" fill="#009A61" font-family="Arial,sans-serif" font-size="11" font-weight="700">24 un.</text>

    <rect x="132" y="207" width="456" height="62" rx="14" fill="#f2faf6"/>
    <rect x="151" y="222" width="32" height="32" rx="9" fill="#dff5e9"/>
    <path d="M159 230h16v16h-16zM159 235h16" stroke="#74a58e" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="200" y="224" width="148" height="9" rx="4.5" fill="#18352a"/>
    <rect x="200" y="244" width="107" height="7" rx="3.5" fill="#b7d1c5"/>
    <rect x="501" y="224" width="68" height="28" rx="9" fill="#dff5e9"/>
    <text x="535" y="243" text-anchor="middle" fill="#527362" font-family="Arial,sans-serif" font-size="11" font-weight="700">15 un.</text>

    <rect x="132" y="283" width="456" height="62" rx="14" fill="#f2faf6"/>
    <rect x="151" y="298" width="32" height="32" rx="9" fill="#c9f2dc"/>
    <path d="M159 306h16v16h-16zM159 311h16" stroke="#009A61" stroke-width="2.2" stroke-linejoin="round"/>
    <rect x="200" y="300" width="112" height="9" rx="4.5" fill="#18352a"/>
    <rect x="200" y="320" width="84" height="7" rx="3.5" fill="#b7d1c5"/>
    <rect x="501" y="300" width="68" height="28" rx="9" fill="#c9f2dc"/>
    <text x="535" y="319" text-anchor="middle" fill="#009A61" font-family="Arial,sans-serif" font-size="11" font-weight="700">32 un.</text>
  </g>

  <g filter="url(#notice-shadow)">
    <rect x="407" y="164" width="209" height="132" rx="17" fill="url(#alert)" stroke="#dbece3" stroke-width="2"/>
    <circle cx="442" cy="199" r="19" fill="#009A61"/>
    <path d="M442 188v13M442 209v.5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="471" y="197" fill="#18352a" font-family="Arial,sans-serif" font-size="15" font-weight="700">Stock bajo</text>
    <text x="471" y="216" fill="#6e8f7f" font-family="Arial,sans-serif" font-size="11">Quedan pocas unidades</text>
    <rect x="430" y="238" width="162" height="36" rx="10" fill="#dff5e9"/>
    <text x="447" y="260" fill="#18352a" font-family="Arial,sans-serif" font-size="11" font-weight="700">Reponer producto</text>
    <path d="M570 250l6 6-6 6" stroke="#009A61" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
